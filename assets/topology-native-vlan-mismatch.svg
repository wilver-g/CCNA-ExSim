<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1f4f78"/>
    </marker>
  </defs>
  <style>
    .bg { fill:#eef5fb; }
    .switch { fill:#ffffff; stroke:#0f4c81; stroke-width:2; rx:12; }
    .port { fill:#dbe9f2; stroke:#0f4c81; stroke-width:1; rx:4; }
    .text { font-family: Arial, Helvetica, sans-serif; font-size:14px; fill:#142f4c; }
    .title { font-size:16px; font-weight:bold; }
    .label { font-size:12px; fill:#0f2b44; }
    .line { stroke:#0f4c81; stroke-width:3; marker-end:url(#arrow); }
  </style>
  <rect width="700" height="260" class="bg" rx="18" />
  <g>
    <rect x="70" y="50" width="180" height="120" class="switch" />
    <text x="160" y="76" class="text title" text-anchor="middle">SW1</text>
    <rect x="90" y="95" width="40" height="20" class="port" />
    <text x="110" y="110" class="text label" text-anchor="middle">PC-A</text>
    <rect x="90" y="130" width="40" height="20" class="port" />
    <text x="110" y="145" class="text label" text-anchor="middle">VLAN 10</text>
    <rect x="90" y="170" width="40" height="20" class="port" />
    <text x="110" y="185" class="text label" text-anchor="middle">VLAN 20</text>
    <rect x="250" y="120" width="110" height="40" rx="8" fill="#dbe9f2" stroke="#0f4c81" />
    <text x="305" y="145" class="text" text-anchor="middle">802.1Q Trunk</text>
    <text x="305" y="160" class="text label" text-anchor="middle">Native VLAN 10</text>
  </g>
  <g>
    <rect x="450" y="50" width="180" height="120" class="switch" />
    <text x="540" y="76" class="text title" text-anchor="middle">SW2</text>
    <rect x="470" y="95" width="40" height="20" class="port" />
    <text x="490" y="110" class="text label" text-anchor="middle">PC-B</text>
    <rect x="470" y="130" width="40" height="20" class="port" />
    <text x="490" y="145" class="text label" text-anchor="middle">VLAN 10</text>
    <rect x="470" y="170" width="40" height="20" class="port" />
    <text x="490" y="185" class="text label" text-anchor="middle">VLAN 20</text>
    <rect x="560" y="120" width="110" height="40" rx="8" fill="#dbe9f2" stroke="#0f4c81" />
    <text x="615" y="145" class="text" text-anchor="middle">802.1Q Trunk</text>
    <text x="615" y="160" class="text label" text-anchor="middle">Native VLAN 1</text>
  </g>
  <line x1="360" y1="140" x2="450" y2="140" class="line" />
  <text x="350" y="235" class="text label" text-anchor="middle">Untagged frames on SW1 are treated as VLAN 10</text>
  <text x="525" y="235" class="text label" text-anchor="middle">Untagged frames on SW2 are treated as VLAN 1</text>
</svg>

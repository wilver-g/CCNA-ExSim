<svg xmlns="http://www.w3.org/2000/svg" width="760" height="260" viewBox="0 0 760 260" role="img" aria-labelledby="title desc">
  <title id="title">Router forwarding topology</title><desc id="desc">R1 connects to R2 and R3. R2 advertises 10.10.0.0 slash 16 and R3 advertises 10.10.10.0 slash 24.</desc>
  <style>text{font-family:Arial,sans-serif;fill:#17324d}.device{fill:#e8f4fb;stroke:#006b9b;stroke-width:3}.route{fill:#f5f8fa;stroke:#91a8b8;stroke-width:2}.line{stroke:#006b9b;stroke-width:3}.label{font-size:16px;font-weight:700}.small{font-size:14px}</style>
  <rect width="760" height="260" rx="16" fill="#f8fbfd"/><text x="30" y="35" class="label">Destination: 10.10.10.25</text>
  <line x1="175" y1="140" x2="315" y2="80" class="line"/><line x1="175" y1="140" x2="315" y2="200" class="line"/>
  <rect x="60" y="105" width="115" height="70" rx="12" class="device"/><text x="102" y="146" class="label">R1</text>
  <rect x="315" y="45" width="115" height="70" rx="12" class="device"/><text x="357" y="86" class="label">R2</text>
  <rect x="315" y="165" width="115" height="70" rx="12" class="device"/><text x="357" y="206" class="label">R3</text>
  <rect x="515" y="40" width="190" height="75" rx="12" class="route"/><text x="535" y="70" class="small">R2 route</text><text x="535" y="94" class="label">10.10.0.0/16</text>
  <rect x="515" y="155" width="190" height="75" rx="12" class="route"/><text x="535" y="185" class="small">R3 route</text><text x="535" y="209" class="label">10.10.10.0/24</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260">
  <style>
    .bg { fill:#eef5fb; }
    .device { fill:#ffffff; stroke:#153856; stroke-width:2; rx:12; }
    .port { fill:#dbe9f2; stroke:#153856; stroke-width:1; rx:6; }
    .text { font-family: Arial, Helvetica, sans-serif; font-size:14px; fill:#132f48; }
    .title { font-size:16px; font-weight:bold; }
    .label { font-size:13px; fill:#0f2b44; }
    .line { stroke:#153856; stroke-width:3; marker-end:url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#153856"/>
    </marker>
  </defs>
  <rect width="700" height="260" class="bg" rx="18" />
  <g>
    <rect x="70" y="70" width="180" height="120" class="device" />
    <text x="160" y="95" class="text title" text-anchor="middle">Access Switch</text>
    <rect x="120" y="110" width="60" height="24" class="port" />
    <text x="150" y="127" class="text" text-anchor="middle">VLAN 10</text>
    <rect x="120" y="150" width="60" height="24" class="port" />
    <text x="150" y="167" class="text" text-anchor="middle">VLAN 20</text>
    <rect x="120" y="190" width="60" height="24" class="port" />
    <text x="150" y="207" class="text" text-anchor="middle">Trunk</text>
  </g>
  <g>
    <rect x="380" y="70" width="220" height="120" class="device" />
    <text x="490" y="95" class="text title" text-anchor="middle">Router</text>
    <text x="440" y="125" class="text label">Gi0/0.10</text>
    <rect x="420" y="135" width="120" height="24" class="port" />
    <text x="470" y="153" class="text" text-anchor="middle">VLAN 10</text>
    <text x="440" y="180" class="text label">Gi0/0.20</text>
    <rect x="420" y="190" width="120" height="24" class="port" />
    <text x="470" y="208" class="text" text-anchor="middle">VLAN 20</text>
  </g>
  <line x1="190" y1="205" x2="380" y2="205" class="line" />
  <text x="285" y="220" class="text label" text-anchor="middle">802.1Q Trunk</text>
  <line x1="520" y1="120" x2="590" y2="120" class="line" />
  <text x="560" y="110" class="text label">Gi0/0</text>
</svg>
